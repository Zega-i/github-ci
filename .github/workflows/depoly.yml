name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v3
      
      # TAMBAHKAN LANGKAH LOGIN INI
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker build --pull -t ghcr.io/$REPO_LOWER:latest .
          docker push ghcr.io/$REPO_LOWER:latest

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Pull and run container
        run: |
            docker pull ghcr.io/${{ github.repository_owner }}/github-ci:latest
            docker stop github-ci-container || true
            docker rm github-ci-container || true
            docker run -p 3000:3000 -d --name github-ci-container ghcr.io/${{ github.repository_owner }}/github-ci:latest