name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: zega-i/github-ci

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          # Menggunakan commit SHA sebagai tag unik
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: self-hosted # <--- KUNCI UTAMA: Runner ini yang akan menjalankan perintah
    steps:
      - name: Deploy Local Server
        run: |
          # Pull tag yang spesifik berdasarkan commit terbaru
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          
          docker stop github-ci-container || true
          docker rm github-ci-container || true
          
          # Jalankan container dengan tag spesifik
          docker run -p 3000:3000 -d --name github-ci-container ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}